name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - BUILD_NUMBER
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NOTARY_PROFILE: monthly-video-generator-notary

jobs:
  macos-release:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release identity
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}-build-${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Monthly Video Generator ${VERSION} (${BUILD_NUMBER})" >> "$GITHUB_ENV"
          echo "DMG_PATH=dist/Monthly-Video-Generator-v${VERSION}-build-${BUILD_NUMBER}-macOS-universal.dmg" >> "$GITHUB_ENV"

      - name: Build package
        run: swift build

      - name: Run tests
        run: ./scripts/test.sh

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "Missing GitHub secret: MACOS_CERTIFICATE_P12_BASE64" >&2
            exit 1
          fi
          if [[ -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "Missing GitHub secret: MACOS_CERTIFICATE_PASSWORD" >&2
            exit 1
          fi
          if [[ -z "$MACOS_CODESIGN_IDENTITY" ]]; then
            echo "Missing GitHub secret: MACOS_CODESIGN_IDENTITY" >&2
            exit 1
          fi
          if [[ -z "$MACOS_KEYCHAIN_PASSWORD" ]]; then
            echo "Missing GitHub secret: MACOS_KEYCHAIN_PASSWORD" >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/monthly-video-generator-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "CODESIGN_IDENTITY=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$APPLE_ID" ]]; then
            echo "Missing GitHub secret: APPLE_ID" >&2
            exit 1
          fi
          if [[ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "Missing GitHub secret: APPLE_APP_SPECIFIC_PASSWORD" >&2
            exit 1
          fi
          if [[ -z "$APPLE_TEAM_ID" ]]; then
            echo "Missing GitHub secret: APPLE_TEAM_ID" >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Build DMG
        run: ./scripts/create_dmg.sh

      - name: Notarize and staple DMG
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$KEYCHAIN_PATH" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -vv --type open --context context:primary-signature "$DMG_PATH"

      - name: Generate release notes
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          CHANGELOG_FILE="docs/WORKING_CHANGELOG.md"
          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo "Missing release-note source: $CHANGELOG_FILE" >&2
            exit 1
          fi

          NOTES_BODY="$(
            awk '
              /^## / {
                if ($0 == "## Unreleased") {
                  in_unreleased = 1
                  seen_unreleased = 1
                  skip_section = 0
                  next
                }
                if (seen_unreleased) {
                  exit
                }
              }
              in_unreleased && /^### Internal \/ Maintenance/ {
                skip_section = 1
                next
              }
              in_unreleased && /^### / {
                skip_section = 0
                next
              }
              in_unreleased && !skip_section && /^- / {
                print
              }
            ' "$CHANGELOG_FILE"
          )"

          if [[ -z "$NOTES_BODY" ]]; then
            echo "No public Unreleased release notes found in $CHANGELOG_FILE" >&2
            exit 1
          fi

          {
            echo "# ${RELEASE_NAME}"
            echo
            echo "Changes from docs/WORKING_CHANGELOG.md"
            echo
            printf '%s\n' "$NOTES_BODY"
            echo
            echo "Distribution note: this macOS DMG is Developer ID signed, notarized by Apple, and stapled for Gatekeeper verification."
          } > "$NOTES_FILE"

          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Refusing to overwrite published release notes or artifacts." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$DMG_PATH" --title "$RELEASE_NAME" --notes-file "$RELEASE_NOTES_FILE"
