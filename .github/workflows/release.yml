name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - BUILD_NUMBER
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-release:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read release identity
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BUILD_NUMBER="$(tr -d '[:space:]' < BUILD_NUMBER)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}-build-${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Monthly Video Generator ${VERSION} (${BUILD_NUMBER})" >> "$GITHUB_ENV"
          echo "DMG_PATH=dist/Monthly-Video-Generator-v${VERSION}-build-${BUILD_NUMBER}-macOS-universal.dmg" >> "$GITHUB_ENV"

      - name: Build package
        run: swift build

      - name: Run tests
        run: ./scripts/test.sh

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Build DMG
        run: ./scripts/create_dmg.sh

      - name: Generate release notes
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          CHANGELOG_FILE="docs/WORKING_CHANGELOG.md"
          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo "Missing release-note source: $CHANGELOG_FILE" >&2
            exit 1
          fi

          NOTES_BODY="$(
            awk '
              /^## / {
                if ($0 == "## Unreleased") {
                  in_unreleased = 1
                  seen_unreleased = 1
                  skip_section = 0
                  next
                }
                if (seen_unreleased) {
                  exit
                }
              }
              in_unreleased && /^### Internal \/ Maintenance/ {
                skip_section = 1
                next
              }
              in_unreleased && /^### / {
                skip_section = 0
                next
              }
              in_unreleased && !skip_section && /^- / {
                print
              }
            ' "$CHANGELOG_FILE"
          )"

          if [[ -z "$NOTES_BODY" ]]; then
            echo "No public Unreleased release notes found in $CHANGELOG_FILE" >&2
            exit 1
          fi

          {
            echo "# ${RELEASE_NAME}"
            echo
            echo "Changes from docs/WORKING_CHANGELOG.md"
            echo
            printf '%s\n' "$NOTES_BODY"
            echo
            echo "Distribution note: this build is ad-hoc signed for local testing and is not notarized. If macOS blocks launch, use Finder Open or System Settings > Privacy & Security > Open Anyway."
          } > "$NOTES_FILE"

          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Refusing to overwrite published release notes or artifacts." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$DMG_PATH" --title "$RELEASE_NAME" --notes-file "$RELEASE_NOTES_FILE"
